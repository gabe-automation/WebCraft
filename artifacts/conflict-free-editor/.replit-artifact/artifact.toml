kind = "web"
previewPath = "/"
title = "Conflict-Free Page Editor"
description = "A lightweight collaborative page authoring sandbox for testing selective node locking, concurrent edits, and deterministic layout conflict resolution."
version = "1.0.0"
id = "artifacts/conflict-free-editor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21357

[services.development]
run = "pnpm --filter @workspace/conflict-free-editor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conflict-free-editor", "run", "build" ]
serve = "static"
publicDir = "artifacts/conflict-free-editor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21357"
BASE_PATH = "/"
